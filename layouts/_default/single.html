{{ define "main" }}
<div class="space-y-4">
  <article class="p-4 bg-background-card rounded-lg m-1 relative">
    
    {{ partial "hero/basic.html" . }}
    
    {{ if .Site.Params.pagelayout.showTitle }}
    <h1 class="text-primary text-3xl md:text-4xl font-bold ">{{ .Title }}</h1>
    {{ end }}

    <div class="text-base prose prose-invert pt-4 max-w-full">
      {{ .Content }}
    </div>

    <nav class="mt-8 pt-6 border-t border-gray-200">
      <div class="flex justify-between">
        {{ with .PrevInSection }}
          <a href="{{ .Permalink }}" class="text-secondary hover:text-blue-800">&larr; {{ .Title }}</a>
        {{ end }}
        {{ with .NextInSection }}
          <a href="{{ .Permalink }}" class="text-secondary hover:text-blue-800">{{ .Title }} &rarr;</a>
        {{ end }}
      </div>
    </nav>
  </article>
</div>
{{ end }}
