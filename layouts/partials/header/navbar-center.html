<nav id="menu" class="w-full max-md:overflow-hidden items-center justify-center backdrop-blur flex-col row flex">
    <form id="globalSearch" class="w-full px-4 flex items-center justify-center" role="search" aria-label="Global">
        <div id="searchbox" class="static w-full">
            <label for="q" class="sr-only">{{ .Title }}</label>
            <span class="hidden md:flex pointer-events-none absolute inset-y-0 right-6 items-center text-primary">
                {{ partial "icon" "search" }}
            </span>

            <input id="q" name="q" type="search" autocomplete="off" placeholder={{ .Title }} class="w-full rounded-full border border-secondary bg-background pl-3 pr-24 py-2.5
                                    text-sm text-primary placeholder:text-primary border-2
                                    focus:outline-none focus:ring-primary focus:border-primary" data-baseurl="{{ $.Site.BaseURL }}"/>
        </div>
    </form>
    <div class="max-md:flex hidden w-full">
        <button class="p-3 w-full">
            <a href="{{ $.Site.BaseURL }}" class="flex items-center justify-center">
                {{ partial "icon" "home" }}
            </a>
        </button>

        {{ range .Site.Params.menu.shortcut }}
        <button class="p-3 w-full">
            {{ if eq .linkType "external" }}
            <a href="{{ .url }}" target="_blank" class="flex items-center justify-center">
                {{ partial "icon" .logo }}
            </a>
            {{ else }}
            <a href="{{ $.Site.BaseURL }}{{ .url }}" class="flex items-center justify-center">
                {{ partial "icon" .logo }}
            </a>
            {{ end }}
        </button>
        {{ end }}
        
        {{ if .Site.Params.showCategoriesMenu }}
        <button class="p-3 w-full">
            <a href="{{ $.Site.BaseURL }}/categories" class="flex items-center justify-center">
                {{ partial "icon" "categories" }}
            </a>
        </button>
        {{ end }}
        {{ if .Site.Params.showTagsMenu }}
        <button class="p-3 w-full">
            <a href="{{ $.Site.BaseURL }}/tags" class="flex items-center justify-center">
                {{ partial "icon" "tag" }}
            </a>
        </button>
        {{ end }}
        
        {{ partial "inputs/dark-mode-switcher.html" . }}
    </div>
</nav>
